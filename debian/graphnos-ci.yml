---
include:
  - project: 'graphiant/graphnos/pipeline-ci'
    file: '/recipes/graphnos.yml'

variables:
  GRAPH_CI_RELEASE: 'main'

  # Disable build log hardening checks
  # blhc checks don't seem to work properly with parallel builds.
  # Sysrepo uses a lot of unit-tests which take a long time to complete.
  # More importantly, It is better that the tests are run on multiple CPUs
  # to work similar to real-world scenarios.
  GRAPH_CI_DISABLE_BLHC: 1

reprotest:
  extends: .test-reprotest
  variables:
    # disable tests, because faketime support is incomplete and causes
    # the tests to see spurious timeouts. Due to this bug:
    # https://bugs.debian.org/cgi-bin/bugreport.cgi?bug=930592
    # faketime is used even in the control run, so turning off time
    # variations isn't sufficient.
    DEB_BUILD_OPTIONS: "nocheck"
